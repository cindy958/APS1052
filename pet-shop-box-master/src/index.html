<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pete's Pet Shop</title>

    <link href="css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body>
    <div class="container">

      <div class="row">
        <div class="col-xs-12 col-sm-8 col-sm-push-2">
          <h1 class="text-center">Pete's Pet Shop</h1>
          <hr/>
          <br/>
        </div>
      </div>

      <!-- Connect Wallet -->
      <div class="row">
        <div class="col-xs-12 col-sm-8 col-sm-push-2 text-center">
          <button id="connectButton" type="button" class="btn btn-primary">
            Connect Wallet
          </button>
          <br/><br/>
        </div>
      </div>

      <!-- =============================== -->
      <!-- ===== Feature 5: Rating UI ===== -->
      <!-- =============================== -->
      <div class="row">
        <div class="col-xs-12 col-sm-8 col-sm-push-2">
          <div class="panel panel-default">
            <div class="panel-heading text-center">
              <h3 class="panel-title">Petshop Rating (1–5 stars)</h3>
            </div>
            <div class="panel-body">

              <div class="form-inline" style="text-align:center;">
                <select id="ratingSelect" class="form-control">
                  <option value="1">1 ★</option>
                  <option value="2">2 ★★</option>
                  <option value="3" selected>3 ★★★</option>
                  <option value="4">4 ★★★★</option>
                  <option value="5">5 ★★★★★</option>
                </select>

                <button id="rateButton" class="btn btn-success" style="margin-left:10px;">
                  Rate
                </button>
              </div>

              <hr/>

              <div style="text-align:center;">
                <strong>Average Rating:</strong>
                <span id="avgRatingText">0.00</span> / 5.00
                &nbsp;&nbsp; | &nbsp;&nbsp;
                <strong>Total Ratings:</strong>
                <span id="ratingCountText">0</span>
              </div>

            </div>
          </div>
        </div>
      </div>

      <!-- Pets -->
      <div id="petsRow" class="row">
        <!-- PETS LOAD HERE -->
      </div>
    </div>

    <!-- Template -->
    <div id="petTemplate" style="display: none;">
      <div class="col-sm-6 col-md-4 col-lg-3">
        <div class="panel panel-default panel-pet">
          <div class="panel-heading">
            <h3 class="panel-title">Scrappy</h3>
          </div>

          <div class="panel-body">
            <img src="" alt="Pet image" class="img-responsive">
            <br/><br/>

            <strong>Breed</strong>: <span class="pet-breed">Golden Retriever</span><br/>
            <strong>Age</strong>: <span class="pet-age">3</span><br/>
            <strong>Location</strong>: <span class="pet-location">Warren, MI</span><br/><br/>

            <strong>Status</strong>:
            <span class="pet-status label label-success">Available</span>
            <br/><br/>

            <button class="btn btn-default btn-adopt" type="button" data-id="0">
              Adopt
            </button>

            <button class="btn btn-warning btn-buy" type="button" data-id="0" style="margin-left:8px;">
              Buy
            </button>

            <br/><br/>

            <button class="btn btn-info btn-like" type="button" data-id="0">
              👍 Like
            </button>
            <span class="pet-likes" style="margin-left:6px; font-weight:bold;">0</span>
          </div>
        </div>
      </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/web3.min.js"></script>
    <script src="js/truffle-contract.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
